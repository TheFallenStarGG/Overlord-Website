<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Overlord Changelog — New Features &amp; Fixes</title>
  <meta name="description" content="Everything that changed in The Overlord Discord bot, newest first: moderation tools, World Campaign, economy, raids, bounties, and more. Updates automatically." />
  <link rel="canonical" href="https://thefallenstargg.github.io/Overlord-Website/changelog.html" />
  <meta name="theme-color" content="#e0b84a" />
  <link rel="stylesheet" href="styles.css" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Overlord" />
  <meta property="og:title" content="The Overlord Changelog — New Features &amp; Fixes" />
  <meta property="og:description" content="Everything that changed in The Overlord, newest first. Updates automatically." />
  <meta property="og:image" content="https://thefallenstargg.github.io/Overlord-Website/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://thefallenstargg.github.io/Overlord-Website/changelog.html" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <script src="data.js"></script>

  <main class="wrap">
    <section class="card hero">
      <p class="eyebrow">Updates · newest first</p>
      <h1>Changelog</h1>
      <p class="lead">
        Everything that has been added or changed in The Overlord. This page updates by itself whenever the bot's
        changelog does. In Discord, <code>!!changelog</code> shows the same list.
      </p>
    </section>

    <div id="log"><p class="meta">Loading…</p></div>
    <noscript><p class="meta">This page needs JavaScript to show the changelog. In Discord, use <code>!!changelog</code> instead.</p></noscript>
  </main>

  <script>
    (async () => {
      const { fetchData, el, rich } = Overlord;
      const box = document.getElementById('log');

      function entry(u, number, latest) {
        const accent = /^#[0-9a-f]{6}$/i.test(u.color) ? u.color : '#e0b84a';
        return el('section', { class: 'card log-entry', id: 'update-' + number, style: '--accent:' + accent },
          el('header', { class: 'log-head' },
            el('span', { class: 'log-emoji', 'aria-hidden': 'true', text: u.emoji }),
            el('div', {},
              el('h2', { class: 'log-title' }, u.title, latest ? el('span', { class: 'log-badge', text: 'Latest' }) : null),
              el('p', { class: 'log-date', text: 'Update #' + number + ' · ' + u.date }))),
          el('p', { class: 'log-summary' }, rich(u.summary)),
          u.sections.map((s) =>
            el('div', { class: 'log-section' },
              el('h3', { text: s.heading }),
              el('ul', {}, s.items.map((item) => el('li', {}, rich(item)))))));
      }

      try {
        const { updates } = await fetchData('changelog.json');
        box.replaceChildren(...updates.map((u, i) => entry(u, updates.length - i, i === 0)));
        const target = location.hash && document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView();
      } catch (err) {
        box.replaceChildren(el('div', { class: 'card' },
          el('p', { class: 'meta', text: 'The changelog could not be loaded right now. Try again in a minute, or use !!changelog in Discord.' })));
      }
    })();
  </script>
</body>
</html>
