<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World Campaign — Global Conquest Map</title>
  <meta name="description" content="Live global campaign for The Overlord." />
  <link rel="canonical" href="https://thefallenstargg.github.io/Overlord-Website/campaign.html" />
  <meta name="theme-color" content="#e0b84a" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .camp-map { width: 100%; height: auto; border-radius: 12px; background: #1a1520; display: block; }
    .camp-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 0.75rem;
      padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      white-space: normal; word-break: normal;
    }
    .camp-row strong { flex: 0 0 auto; }
    .camp-row .meta { flex: 1 1 auto; opacity: 0.75; font-size: 0.9em; }
    .camp-note { opacity: 0.7; font-size: 0.9em; margin: 0.5rem 0 0; }
  </style>
</head>
<body>
  <script src="data.js"></script>
  <main class="wrap">
    <section class="card hero compact">
      <p class="eyebrow">Global realm</p>
      <h1>Campaign</h1>
      <p class="lead">One shared map. Each server is a house. Fight for the same provinces.</p>
      <div class="stats">
        <div class="stat"><b id="c-status">—</b><span>Status</span></div>
        <div class="stat"><b id="c-turn">—</b><span>Turn</span></div>
        <div class="stat"><b id="c-houses">—</b><span>Houses</span></div>
        <div class="stat"><b id="c-land">—</b><span>Held</span></div>
      </div>
    </section>
    <div id="content"><div class="skeleton block"></div></div>
  </main>
  <script>
    (async () => {
      const { fetchData, el, timeAgo, fmt, DATA_BASE } = Overlord;
      const $ = (id) => document.getElementById(id);

      try {
        const c = await fetchData('campaign.json');
        const held = (c.provinces || []).filter((p) => p.ownerId).length;
        const total = (c.provinces || []).length;
        $('c-status').textContent = !c.active ? 'Off' : c.paused ? 'Paused' : 'Active';
        $('c-turn').textContent = String(c.turn ?? 0);
        $('c-houses').textContent = fmt(c.houseCount || 0);
        $('c-land').textContent = held + '/' + total;

        const out = [];

        // Map
        const mapCard = el('section', { class: 'card' });
        mapCard.append(el('h2', { text: 'Map' }));
        const img = el('img', {
          class: 'camp-map',
          alt: 'Campaign map',
          src: DATA_BASE + (c.mapImage || 'campaign-map.png') + '?t=' + Date.now(),
        });
        img.onerror = () => {
          img.replaceWith(el('p', {
            class: 'camp-note',
            text: 'Map PNG not on the data branch yet. After the bot logs “Campaign map export · updated”, refresh this page.',
          }));
        };
        mapCard.append(img);
        out.push(mapCard);

        out.push(el('section', { class: 'card' },
          el('h2', { text: 'Season' }),
          el('p', {
            class: 'camp-note',
            text:
              'Season ' + (c.seasonKey || '—') +
              ' · Next resolve: ' + (c.nextTickAt ? new Date(c.nextTickAt).toUTCString() : '—') +
              (c.full ? ' · Map FULL' : ' · Neutral: ' + (c.neutral ?? '—')),
          })
        ));

        const houseBox = el('section', { class: 'card' }, el('h2', { text: 'Houses' }));
        if (!(c.houses || []).length) {
          houseBox.append(el('p', { class: 'camp-note', text: 'No houses yet.' }));
        } else {
          for (const [i, h] of c.houses.entries()) {
            houseBox.append(
              el('div', { class: 'camp-row' },
                el('strong', { text: (i + 1) + '. ' + h.name }),
                el('span', { class: 'meta', text: (h.provinceCount || 0) + ' provinces · ' + fmt(h.score || 0) + ' pts' })
              )
            );
          }
        }
        out.push(houseBox);

        const provBox = el('section', { class: 'card' }, el('h2', { text: 'Provinces' }));
        for (const p of c.provinces || []) {
          let line = 'Neutral';
          if (p.ownerName) {
            const troops = (p.armies || []).map((a) => a.size + ' (' + a.houseName + ')').join(', ');
            line = 'Held by ' + p.ownerName + (troops ? ' · ' + troops : '');
          }
          provBox.append(
            el('div', { class: 'camp-row' },
              el('strong', { text: p.name }),
              el('span', { class: 'meta', text: line })
            )
          );
        }
        out.push(provBox);

        if ((c.log || []).length) {
          const logBox = el('section', { class: 'card' }, el('h2', { text: 'Recent log' }));
          for (const e of c.log) {
            logBox.append(el('div', { class: 'camp-row' },
              el('span', { class: 'meta', text: (e.at ? timeAgo(e.at) + ' — ' : '') + (e.text || '') })
            ));
          }
          out.push(logBox);
        }

        out.push(el('p', { class: 'camp-note', text: 'Data ' + timeAgo(c.generatedAt) + ' · Discord: !!campaign' }));
        $('content').replaceChildren(...out);
      } catch {
        $('content').replaceChildren(el('div', { class: 'card' },
          el('p', { class: 'camp-note', text: 'Could not load campaign.json.' })));
      }
    })();
  </script>
</body>
</html>
